name: Release DMG

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to release, for example 1.0.0
        required: true
        type: string
      prerelease:
        description: Publish as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  REPOSITORY: u1-fan/AudioTag

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
      tag: ${{ steps.plan.outputs.tag }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release request
        id: plan
        env:
          VERSION_INPUT: ${{ inputs.version }}
          PRERELEASE_INPUT: ${{ inputs.prerelease }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          plan_json="$(python3 script/plan_release.py "$VERSION_INPUT" --prerelease "$PRERELEASE_INPUT")"
          python3 - "$plan_json" "$GITHUB_OUTPUT" <<'PY'
          import json
          import pathlib
          import sys
          values = json.loads(sys.argv[1])
          with pathlib.Path(sys.argv[2]).open("a", encoding="utf-8") as output:
              for key in ("version", "build", "tag", "source_sha"):
                  print(f"{key}={values[key]}", file=output)
          PY

  build:
    needs: plan
    runs-on: macos-15
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      BUILD: ${{ needs.plan.outputs.build }}
      TAG: ${{ needs.plan.outputs.tag }}
      DMG_NAME: AudioTag-v${{ needs.plan.outputs.version }}-macOS-arm64.dmg
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' pyinstaller
          brew list pkg-config >/dev/null 2>&1 || brew install pkg-config
          brew list nasm >/dev/null 2>&1 || brew install nasm

      - name: Validate release secrets
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in CERTIFICATE_BASE64 CERTIFICATE_PASSWORD API_KEY_BASE64 API_KEY_ID API_ISSUER_ID SPARKLE_PRIVATE_KEY; do
            [[ -n "${!name}" ]] || { echo "缺少 GitHub Secret：$name" >&2; exit 1; }
          done

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/release-signing.keychain-db"
          keychain_password="$(uuidgen)"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode -o "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          identity="$(security find-identity -v -p codesigning "$keychain_path" | sed -n 's/.*"\(Developer ID Application:[^"]*\)"/\1/p' | head -n 1)"
          [[ -n "$identity" ]]
          echo "SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Run release checks
        run: |
          set -euo pipefail
          swift test
          python -m pytest -q
          node --test tests/site.test.cjs tests/local_editor.test.cjs
          python3 script/release_check.py "$TAG"

      - name: Prepare LGPL source archives
        run: |
          set -euo pipefail
          mkdir -p .build/release-tools
          cp site/sources/ffmpeg-9.0.2.tar.xz .build/release-tools/
          cp site/sources/lame-4.0.tar.gz .build/release-tools/

      - name: Build signed DMG
        run: |
          set -euo pipefail
          DIST_DIR="$GITHUB_WORKSPACE/dist/release" SIGNING_IDENTITY="$SIGNING_IDENTITY" \
            bash script/package_dmg.sh "$VERSION"

      - name: Notarize and staple DMG
        env:
          API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          dmg_path="dist/release/$DMG_NAME"
          api_key_path="$RUNNER_TEMP/AuthKey_${API_KEY_ID}.p8"
          result_path="$RUNNER_TEMP/notarization-result.json"
          printf '%s' "$API_KEY_BASE64" | base64 --decode -o "$api_key_path"
          xcrun notarytool submit "$dmg_path" --key "$api_key_path" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID" --wait --output-format json > "$result_path"
          cat "$result_path"
          status="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$result_path")"
          if [[ "$status" != Accepted ]]; then
            submission_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$result_path")"
            xcrun notarytool log "$submission_id" --key "$api_key_path" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID" || true
            exit 1
          fi
          xcrun stapler staple "$dmg_path"
          xcrun stapler validate "$dmg_path"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg_path"

      - name: Generate signed Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          feed_dir="$RUNNER_TEMP/sparkle-feed"
          mkdir -p "$feed_dir"
          cp "dist/release/$DMG_NAME" "$feed_dir/$DMG_NAME"
          existing_feed="https://github.com/$REPOSITORY/releases/latest/download/appcast.xml"
          if curl --fail --location --silent --show-error "$existing_feed" -o "$feed_dir/appcast.xml"; then
            :
          else
            rm -f "$feed_dir/appcast.xml"
          fi
          appcast_tool="$(find .build/artifacts -type f -path '*/Sparkle/bin/generate_appcast' -print -quit)"
          [[ -x "$appcast_tool" ]]
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$appcast_tool" --ed-key-file - \
            --maximum-deltas 0 --download-url-prefix "https://github.com/$REPOSITORY/releases/download/$TAG/" \
            --link "https://audiotag.u1.fan/" "$feed_dir"
          python3 script/verify_appcast.py "$feed_dir/appcast.xml" "$BUILD" "$DMG_NAME"
          cp "$feed_dir/appcast.xml" dist/release/appcast.xml

      - name: Verify DMG checksum
        run: |
          set -euo pipefail
          hdiutil verify "dist/release/$DMG_NAME"
          (cd dist/release && shasum -a 256 "$DMG_NAME" > "$DMG_NAME.sha256")
          (cd dist/release && shasum -a 256 -c "$DMG_NAME.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: audio-tag-release
          path: |
            dist/release/${{ env.DMG_NAME }}
            dist/release/${{ env.DMG_NAME }}.sha256
            dist/release/appcast.xml
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [plan, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      DMG_NAME: AudioTag-v${{ needs.plan.outputs.version }}-macOS-arm64.dmg
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: audio-tag-release
          path: release-assets
      - name: Verify artifacts
        run: |
          set -euo pipefail
          (cd release-assets && shasum -a 256 -c "$DMG_NAME.sha256")
      - name: Publish GitHub Release
        run: |
          set -euo pipefail
          notes=$'AudioTag '"$TAG"$' for Apple Silicon Mac running macOS 26 or later.\n\nSigned with Developer ID Application and notarized by Apple.'
          gh release create "$TAG" \
            "release-assets/$DMG_NAME" \
            "release-assets/$DMG_NAME.sha256" \
            "release-assets/appcast.xml" \
            --repo "$REPOSITORY" --target "${{ needs.plan.outputs.source_sha }}" \
            --title "AudioTag $TAG" --notes "$notes"
